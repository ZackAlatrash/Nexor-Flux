name: PR Checks

# Compiles the app, runs the unit suite, and runs Android lint on every PR and
# on every push to the integration branches. This is the first CI step that
# actually type-checks and tests the code — the distribute workflows only build
# a debug APK on push to main.

on:
  pull_request:
  push:
    branches: [develop, main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Compiles debug + test sources and runs the unit suite across BOTH modules.
      # :shared must be listed explicitly — the iOS port moved ~400 domain tests out of
      # :app into shared/src/androidUnitTest, and :app:testDebugUnitTest does not reach
      # them. Omitting it silently drops a third of the suite from CI.
      # The iOS targets (iosArm64, iosSimulatorArm64) are configured but never built here;
      # Kotlin/Native for Apple requires macOS, and these runners are ubuntu-latest.
      # InsightHarnessTest self-skips here: it needs .env.test / INSIGHT_* creds,
      # which CI does not provide, so it never makes live network calls.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:testDebugUnitTest

      # Run lint even when the tests fail, so one PR run surfaces both.
      # The app sets abortOnError = false, so lint reports but never blocks the
      # build; the report is uploaded below so findings stay visible.
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
