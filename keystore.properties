# Shared signing config so EVERY build (local debug, CI debug, release, App Distribution)
# is signed with ONE fixed key. This keeps the app signature stable across machines and
# channels, so installs are in-place updates and never wipe app data.
#
# This is a debug-tier signing key for a personal test app — intentionally committed so CI
# and every machine sign identically with zero setup. It is NOT a Google Play upload key.
# storeFile is resolved relative to the repo root.
storeFile=keystore/recomp-shared.jks
storePassword=recomptracker
keyAlias=recomp
keyPassword=recomptracker
